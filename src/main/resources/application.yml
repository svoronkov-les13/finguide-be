spring:
  application:
    name: finguide-be
  datasource:
    url: ${FINGUIDE_DATASOURCE_URL:jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_UPPER=false}
    username: ${FINGUIDE_DATASOURCE_USERNAME:sa}
    password: ${FINGUIDE_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: ${FINGUIDE_H2_CONSOLE_ENABLED:true}
      path: /h2-console
  sql:
    init:
      mode: always
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.sql
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/finguide}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: /finguide-api

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    config-url: ${FINGUIDE_SWAGGER_CONFIG_URL:/v3/api-docs/swagger-config}
    url: ${FINGUIDE_SWAGGER_API_DOCS_URL:/v3/api-docs}
  api-docs:
    path: /v3/api-docs

finguide:
  security:
    demo-mode: ${FINGUIDE_DEMO_MODE:true}
    required-audience: ${KEYCLOAK_AUDIENCE:finguide-api}
  keycloak:
    admin-realm: ${FINGUIDE_KEYCLOAK_ADMIN_REALM:master}
    admin-client-id: ${FINGUIDE_KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    admin-username: ${FINGUIDE_KEYCLOAK_ADMIN_USERNAME:}
    admin-password: ${FINGUIDE_KEYCLOAK_ADMIN_PASSWORD:}
    password-reset-client-id: ${FINGUIDE_KEYCLOAK_PASSWORD_RESET_CLIENT_ID:finguide-web}
    password-reset-max-attempts: ${FINGUIDE_KEYCLOAK_PASSWORD_RESET_MAX_ATTEMPTS:3}
    password-reset-window: ${FINGUIDE_KEYCLOAK_PASSWORD_RESET_WINDOW:PT1H}
