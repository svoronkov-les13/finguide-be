name: Build and Push Docker image to GHCR

on:
  push:
    branches:
      - main
    # Можно добавить paths: если хотите собирать только при изменении backend
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag
        required: true
        default: les13

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build jar with Maven
        run: mvn -B clean package

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: vars
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/svoronkov-les13/finguide-api"
          if [[ -n "${INPUT_TAG:-}" ]]; then
            tag="$INPUT_TAG"
          else
            tag="latest"
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag: $tag" >&2
            exit 1
          fi
          echo "IMAGE_TAG=${image}:${tag}" >> "$GITHUB_ENV"
          echo "SHA_IMAGE_TAG=${image}:sha-${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build -t "$IMAGE_TAG" -t "$SHA_IMAGE_TAG" .

      - name: Push image to GHCR
        run: |
          docker push "$IMAGE_TAG"
          docker push "$SHA_IMAGE_TAG"
